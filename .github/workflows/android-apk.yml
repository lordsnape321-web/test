# Build an installable Android APK for the Expo app, on GitHub's runners.
#
# Why here: a release APK has to be built with the Android SDK, the NDK and a
# JDK — none of which belong in a git checkout, and the Expo app is generated
# natively (`npx expo prebuild`) rather than keeping `android/` in the tree. A
# runner has all three, so the APK is produced from a clean checkout of this
# branch, the same way every time, and lands as a downloadable artifact.
#
# What it does:
#   npm ci → expo prebuild (Android) → gradlew assembleRelease → upload artifact
#
# The release build type is signed with the debug keystore that the generated
# project creates for itself, which is what makes the APK installable (Android
# refuses an unsigned one). That is fine for testing on a phone; a Play Store
# upload would need a real keystore in a secret (see the README).
#
# The backend the app talks to is baked in at bundle time from the repository
# variable API_BASE (Settings → Secrets and variables → Actions → Variables).
# Leave it unset and the app falls back to its build default, and the sign-in
# screen's "Server address" can point it at any reachable Laravel afterwards.
#
# Push notifications need one more optional variable: EAS_PROJECT_ID. Set it and
# the APK registers for remote push (the app already presents banners from the
# in-app bell without it); leave it unset and the app says so instead of failing
# silently. See the README's push section for where the id comes from.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/01a0effd-test"
      - main

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # The APK is attached to a release so it can be downloaded without signing in
  # to GitHub; the artifact upload above it needs no extra permission.
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: futsal-expo-app

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: futsal-expo-app/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      # Proof, in the run itself, that the generated manifest is the one the
      # phone needs: without this attribute Android refuses every plain-http
      # call to a LAN backend, which is indistinguishable from "server not
      # found" on the device. Fail loudly if a future prebuild drops it.
      - name: Check the project can reach the backend and receive push
        run: |
          manifest=android/app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="true"' "$manifest" \
            || { echo "::error::usesCleartextTraffic missing from $manifest"; exit 1; }
          grep -q 'package="com.futsalmate.app"' android/app/build.gradle \
            || grep -q 'com.futsalmate.app' android/app/build.gradle \
            || { echo "::error::applicationId is not com.futsalmate.app"; exit 1; }
          # Push: the notification icon and colour come from the app manifest,
          # but Android 13's POST_NOTIFICATIONS permission and the Firebase
          # messaging service come from the library manifest and are merged in
          # by Gradle. Check both places, so a dependency that stops shipping
          # them fails the run instead of shipping a phone that never buzzes.
          grep -q 'com.google.firebase.messaging.default_notification_icon' "$manifest" \
            || { echo "::error::notification icon meta-data missing from $manifest"; exit 1; }
          notif_manifest=node_modules/expo-notifications/android/src/main/AndroidManifest.xml
          grep -q 'android.permission.POST_NOTIFICATIONS' "$notif_manifest" \
            || { echo "::error::POST_NOTIFICATIONS missing from $notif_manifest"; exit 1; }
          grep -q 'FirebaseMessagingService' "$notif_manifest" \
            || { echo "::error::FirebaseMessagingService missing from $notif_manifest"; exit 1; }
          node -e "const p=require('./app.json').expo.plugins||[]; const ok=p.some(x=>(Array.isArray(x)?x[0]:x)==='expo-notifications'); if(!ok){console.error('::error::expo-notifications plugin is missing from app.json');process.exit(1)}"
          echo "manifest ok: cleartext allowed for LAN testing, package com.futsalmate.app, push wired"

      - name: Build the release APK
        working-directory: futsal-expo-app/android
        env:
          EXPO_PUBLIC_API_BASE: ${{ vars.API_BASE }}
          # Optional: without it the app skips remote push registration and
          # keeps the in-app bell + foreground banners.
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
          EXPO_NO_TELEMETRY: "1"
          CI: "1"
        run: |
          # One ABI keeps the download small and the build inside the job
          # timeout; every phone since ~2016 is arm64-v8a. Add
          # "armeabi-v7a,x86_64" to the list below for older or emulated
          # devices.
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Name the APK after the app and its version
        id: apk
        working-directory: futsal-expo-app
        run: |
          version=$(node -p "require('./app.json').expo.version")
          name="futsal-mate-${version}-$(echo '${{ github.sha }}' | cut -c1-7).apk"
          dir=android/app/build/outputs/apk/release
          cp "$dir"/*.apk "$dir/$name"
          # A second copy under a name that never changes. gh names a release
          # asset after the file it uploads, so this is what keeps
          # /releases/download/apk/futsal-mate-latest.apk pointing at the newest
          # build even though the release is recreated each time.
          cp "$dir/$name" "$dir/futsal-mate-latest.apk"
          ls -lh "$dir"
          echo "path=$dir/$name" >> "$GITHUB_OUTPUT"
          echo "latest=$dir/futsal-mate-latest.apk" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: futsal-mate-apk
          path: futsal-expo-app/${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      # Also hand it over as a release asset: an artifact needs a GitHub login
      # to download, a release asset does not — the phone can install it
      # straight from the browser. The asset is named `futsal-mate-latest.apk`
      # on purpose: the release is recreated per build, so the URL
      # /releases/download/apk/futsal-mate-latest.apk always points at this
      # branch's newest APK.
      - name: Publish a download link
        continue-on-error: true
        working-directory: futsal-expo-app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag 2>/dev/null || true
          gh release create apk "${{ steps.apk.outputs.latest }}" \
            --title "Futsal Mate — latest APK (${{ steps.apk.outputs.name }})" \
            --notes "Built from ${{ github.sha }} on ${{ github.ref_name }} (${{ steps.apk.outputs.name }}). Signed with the debug keystore: install it directly (allow \"install unknown apps\" for your browser), or run adb install -r." \
            --prerelease
